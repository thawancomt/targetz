[package]
name = "app"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Whatever Targetz"

[dependencies]
gpui-kit.workspace = true
sqlx.workspace = true
thiserror.workspace = true
gpui-fps.workspace = true

shared = {path = "../shared"}
sidebar  =  {path ="../sidebar"}
settings  =  {path ="../settings"}
customers  =  {path ="../customers"}
projects  =  {path ="../projects"}
dotenv = "0.15.0"
tokio = { version = "1.53.1", features = ["full"]}

[package.metadata.generate-rpm]
name = "targetz"
summary = "Whatever Targetz"
assets = [
    { source = "target/release/app", dest = "/usr/bin/whatever_targetz", mode = "755" },
    { source = "assets/targetz.desktop", dest = "/usr/share/applications/targetz.desktop", mode = "644" },
    { source = "assets/icon.png", dest = "/usr/share/pixmaps/icon.png", mode = "644" }
]
